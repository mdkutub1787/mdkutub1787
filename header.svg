    <text x="160" y="25" text-anchor="middle" fill="#667A95" class="mono" font-size="10">DEV_COMMAND_CENTER</text>
    <text x="20" y="80" fill="#39D9FF" class="mono" font-size="14">$ whoami</text>
    <text x="20" y="105" fill="#D6E1EF" class="mono" font-size="14">mobile-erp-engineer</text>
    <text x="20" y="145" fill="#8B5CF6" class="mono" font-size="14">$ current_focus</text>
    <text x="20" y="170" fill="#D6E1EF" class="mono" font-size="14">ERP · Hardware SDKs · Offline</text>
    <text x="20" y="210" fill="#F7A41D" class="mono" font-size="14">$ status</text>
    <text x="20" y="235" fill="#37E69A" class="mono" font-size="14">building_future...</text>
